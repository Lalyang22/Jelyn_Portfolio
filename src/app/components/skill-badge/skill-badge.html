<span
  class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-sans font-medium text-brand-ink transition-transform duration-200 hover:scale-105"
  [ngClass]="badgeClass"
>
  @if (skill.icon) {
    <i [class]="skill.icon + ' text-base leading-none'" aria-hidden="true"></i>
  }
  {{ skill.name }}
</span>
